[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reactive-navigation"
version = "0.1.0"
description = "Safe and reactive navigation simulation for robots in granular terrain environments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "concave-hull>=0.0.9",
    "extremitypathfinder>=2.7.1",
    "future>=1.0.0",
    "GPy>=1.13.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "Pillow>=10.4",
    "pygame>=2.6",
    "pyproj>=3.6",
    "pyvoro2>=0.6.3",
    "scipy>=1.11",
    "shapely>=2.0",
    "tqdm>=4.67",
    "tripy>=1.0.0",
]

[project.scripts]
reactive-navigation = "reactive_navigation.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reactive_navigation*", "safeopt*"]
