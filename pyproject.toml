[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reactive-navigation"
version = "0.1.0"
description = "Safe and reactive navigation simulation for robots in granular terrain environments."
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "concave-hull==0.0.9",
    "extremitypathfinder==2.1.0",
    "future==1.0.0",
    "GPy==1.13.2",
    "matplotlib==3.6.3",
    "numpy==1.19.3",
    "Pillow==10.4.0",
    "pygame==2.6.1",
    "pyproj==3.5.0",
    "pyvoro==1.3.2",
    "scipy==1.9.3",
    "shapely==1.7.1",
    "tomli==2.0.1",
    "tqdm==4.67.1",
    "tripy==1.0.0",
]

[project.scripts]
reactive-navigation = "reactive_navigation.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reactive_navigation*", "safeopt*"]
